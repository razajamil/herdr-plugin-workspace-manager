id = "herdr-plugin-workspace-manager"
name = "Workspace Manager"
version = "0.8.0"
min_herdr_version = "0.7.5"
description = "Declarative tab/pane layouts with per-workspace defaults applied automatically when a worktree is created."
platforms = ["linux", "macos"]

# All entrypoints go through bin/herdr-workspace-manager, an sh shim that
# compiles the Rust binary on first use (cargo build --release) and execs it.
# After that one-off build there is no runtime dependency at all.

# One-shot state maintenance after the server restores its session (and after a
# live handoff): drops claims for worktrees that no longer exist and clears the
# per-session focus cache. This used to run on every event invocation.
[[startup]]
command = ["sh", "bin/herdr-workspace-manager", "startup"]

# Fires for every new worktree. The handler matches the new worktree's checkout
# path against the configured workspaces and, if a default layout is set, applies
# it (creates the tabs/panes and runs their commands).
[[events]]
on = "worktree.created"
command = ["sh", "bin/herdr-workspace-manager", "event"]

# The herdr UI "new worktree" command has historically created the worktree
# in-app and emitted NEITHER worktree.created nor workspace.created to plugins —
# the only event it dispatches is workspace.focused (it focuses the new worktree
# on creation). So we also listen for workspace.created (CLI path) and
# workspace.focused (UI path). The hook dedupes, so the extra events are
# harmless.
#
# workspace.focused fires on every workspace switch, so its early-exit path is
# kept to a single stat. If your herdr build does deliver worktree.created for
# UI-created worktrees, set HERDR_WSM_FOCUS_HOOK=0 to skip it entirely — see
# "Is the workspace.focused hook still needed?" in the README.
[[events]]
on = "workspace.created"
command = ["sh", "bin/herdr-workspace-manager", "event"]

[[events]]
on = "workspace.focused"
command = ["sh", "bin/herdr-workspace-manager", "event"]

# Manually apply a layout to the current (or a target) workspace. With no
# argument it applies the workspace's default layout; pass a layout id to force
# a specific one. Also used by the integration test as a controllable hook.
[[actions]]
id = "apply"
title = "Apply workspace layout"
contexts = ["workspace"]
command = ["sh", "bin/herdr-workspace-manager", "apply"]

# Parse + validate the config file and print the resolved layouts/workspaces.
[[actions]]
id = "validate"
title = "Validate workspace config"
command = ["sh", "bin/herdr-workspace-manager", "validate"]

# Preview the current repo's linked worktrees whose remote branch was deleted
# ("gone"). Removes nothing — worktrees that never pushed/tracked a remote are
# never listed. Run from any workspace of the repo you want to clean up. To
# actually remove them, use the CLI: `herdr-workspace-manager remove-gone`
# (it prompts; pass --confirm to skip the prompt). The action stays preview-only
# because plugin actions run headless and can't ask for confirmation.
[[actions]]
id = "remove-gone"
title = "Remove gone worktrees (preview)"
contexts = ["workspace"]
command = ["sh", "bin/herdr-workspace-manager", "remove-gone", "--preview"]

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-plugin-workspace-manager.apply"
description = "apply workspace layout"
